<g id="box-front-panels"><path d="M56 75 126 111V159L56 123Z" fill="#e48268"/><path d="M126 111 191 77V125L126 159Z" fill="#f6c267"/><path d="M56 183 126 219V267L56 231Z" fill="#f6c267"/><path d="M126 219 191 185V233L126 267Z" fill="#c5e2e9"/>
