<g clip-path="url(#diamond-sail-clip)" stroke="#f4f0e7" stroke-width="1" opacity=".68"><path d="M32 60H114M32 76H114M32 92H114M49 24V109M65 24V109M81 24V109M97 24V109"/></g>
